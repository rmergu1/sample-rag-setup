version: "3.9"

services:
  db:
    image: docker.io/pgvector/pgvector:pg16
    container_name: rag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - rag-db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:Z
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  embedding-service:
    build: ./embedding-service
    container_name: rag-embedding-service
    restart: unless-stopped
    env_file: .env
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rag-api:
    build: ./rag-api
    container_name: rag-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: apache/Dockerfile
    container_name: rag-frontend
    restart: unless-stopped
    depends_on:
      - rag-api
    ports:
      - "8090:80"

  # Not started by `podman-compose up`. Run on demand:
  #   podman-compose run --rm ingest --action ingest --path /data
  #   podman-compose run --rm ingest --action delete --path /data/some_file.pdf
  ingest:
    build: ./ingest
    container_name: rag-ingest
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    volumes:
      - ./documents:/data:Z
    profiles: ["tools"]

volumes:
  rag-db-data:
